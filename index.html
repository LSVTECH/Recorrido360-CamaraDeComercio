<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Camara de Comercio</title>
  <meta name="viewport" id="metaViewport" content="user-scalable=no, initial-scale=1, width=device-width, viewport-fit=cover">
  <script>
    // Igual que 3DVista (data-tdv-general-scale="0.5"): en móviles la interfaz se dibuja a escala 0.5
    if (/Android|iPhone|iPod|Mobile/i.test(navigator.userAgent) && !/iPad/i.test(navigator.userAgent))
    { document.getElementById('metaViewport').content = 'user-scalable=no, initial-scale=0.5, width=device-width, viewport-fit=cover';
      document.documentElement.classList.add('mobile-scale'); }
  </script>
  <meta name="description" content="Virtual Tour">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="misc/icon32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="misc/icon192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="misc/icon180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="modulepreload" href="lib/three.module.min.js">
  <link rel="stylesheet" href="css/tour.css">
</head>
<body>
  <div id="app">
    <div id="download-bar" hidden>
      <span class="dl-text">Descargar el tour para reproducirlo sin conexión</span>
      <button class="dl-btn" type="button">Descargar</button>
      <div class="dl-progress" hidden><div class="dl-fill"></div></div>
      <button class="dl-close" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 10 10"><path d="M1 1L9 9M9 1L1 9"/></svg>
      </button>
    </div>
    <div id="stage">
      <div id="viewer"></div>
      <button id="vr-exit" type="button">Salir de VR</button>
    </div>
  </div>
  <div id="preload"><span>Loading virtual tour. Please wait...</span></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
